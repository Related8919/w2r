name: Check MIIT Vehicle Documents

on:
  workflow_run:
    workflows:
      - Generate RSS Feed
    types:
      - completed
  workflow_dispatch:
    inputs:
      article_url:
        description: Optional MIIT article URL for a manual test
        required: false
        type: string

permissions:
  contents: read

env:
  RSS_PATH: "rss/工信部车辆准入许可.xml"
  PREVIOUS_REF: "HEAD^"
  ARTICLE_TITLE_KEYWORD: "道路机动车辆生产企业及产品"
  ATTACHMENT_NAME_KEYWORD: "道路机动车辆生产企业及产品"
  DOCUMENT_SEARCH_TEXT: "特斯拉"
  ALLOWED_HOST: "www.miit.gov.cn"
  REQUEST_TIMEOUT_SECONDS: "30"
  BARK_BASE_URL: "https://api.day.app"
  BARK_TITLE: "工信部车辆准入许可命中"
  BARK_GROUP: "工信部车辆准入许可"
  DRY_RUN: "false"
  MANUAL_ARTICLE_URL: ${{ inputs.article_url }}

jobs:
  inspect-document:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest generated feeds
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes antiword
          python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Inspect new vehicle documents
        env:
          BARK_TOKEN: ${{ secrets.BARK_TOKEN }}
        run: |
          if [[ -n "${MANUAL_ARTICLE_URL}" ]]; then
            python scripts/miit_vehicle_monitor.py \
              --article-url "${MANUAL_ARTICLE_URL}"
          else
            python scripts/miit_vehicle_monitor.py \
              --feed "${RSS_PATH}" \
              --previous-ref "${PREVIOUS_REF}"
          fi
