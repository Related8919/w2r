name: Generate RSS Feed

on:
  push:
    branches:
      - main  # 或你想要的分支
    paths:
      - '.github/workflows/rss_generator.yml'
      - 'rss_generator.py'
      - 'config.yaml'
      - 'scripts/manual_version_monitor.py'
      - 'scripts/manual_rss_generator.py'
      - 'requirements.txt'
  schedule:
    - cron: '0 0 * * *'  # 每天运行一次
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: rss-generator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  TARGET_BRANCH: ${{ github.ref_name }}
  MODEL3_MANUAL_URL: ${{ secrets.MODEL3_MANUAL_URL }}
  MODELY_MANUAL_URL: ${{ secrets.MODELY_MANUAL_URL }}
  MANUAL_VERSION_CONTAINER_CSS: ${{ secrets.MANUAL_VERSION_CONTAINER_CSS }}
  MANUAL_VERSION_TEXT_PREFIX: ${{ secrets.MANUAL_VERSION_TEXT_PREFIX }}
  MANUAL_PDF_LINK_CSS: ${{ secrets.MANUAL_PDF_LINK_CSS }}
  MODEL3_MANUAL_RSS_PATH: "rss/model3_manual.xml"
  MODELY_MANUAL_RSS_PATH: "rss/modely_manual.xml"
  MANUAL_STATE_RELEASE_TAG: "manual-version-state"
  MANUAL_REQUEST_TIMEOUT_SECONDS: "120"
  MANUAL_RSS_MAX_ITEMS: "50"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'  # 或其他你需要的版本

    - name: Install dependencies
      run: |
        pip install -r requirements.txt  # 确保requirements.txt包含selenium和其他依赖

    - name: Run RSS generator
      run: |
        python rss_generator.py  # 运行你的Python脚本
    - name: Download Microsoft Research Feed
      run: |
        curl -o rss/MicrosoftResearch.xml https://www.microsoft.com/en-us/research/feed/

    - name: Restore manual version state
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "${RUNNER_TEMP}/manual-generator-state"
        if gh release view "${MANUAL_STATE_RELEASE_TAG}" >/dev/null 2>&1; then
          state_asset_count="$(gh release view "${MANUAL_STATE_RELEASE_TAG}" \
            --json assets \
            --jq '[.assets[] | select(.name == "manual-version-state.json")] | length')"
          if [[ "${state_asset_count}" -eq 1 ]]; then
            gh release download "${MANUAL_STATE_RELEASE_TAG}" \
              --dir "${RUNNER_TEMP}/manual-generator-state" \
              --pattern "manual-version-state.json" \
              --clobber
          elif [[ "${state_asset_count}" -gt 1 ]]; then
            echo "Expected at most one manual-version-state.json Release asset."
            exit 1
          fi
        fi

    - name: Generate owner manual RSS placeholders
      id: manual-rss
      continue-on-error: true
      run: |
        python scripts/manual_rss_generator.py \
          --result-file "${RUNNER_TEMP}/manual-rss-result.json" \
          --candidate-dir "${RUNNER_TEMP}/manual-pdf-input" \
          --state-file \
            "${RUNNER_TEMP}/manual-generator-state/manual-version-state.json"

    - name: Inspect owner manual RSS state
      id: manual-status
      if: always()
      run: |
        if [[ -n "$(git status --porcelain -- \
          "${MODEL3_MANUAL_RSS_PATH}" "${MODELY_MANUAL_RSS_PATH}")" ]]; then
          echo "changed=true" >> "${GITHUB_OUTPUT}"
        else
          echo "changed=false" >> "${GITHUB_OUTPUT}"
        fi
        if [[ -f "${RUNNER_TEMP}/manual-rss-result.json" ]] && \
          jq -e \
            '.dispatch_required == true and .candidate_count > 0' \
            "${RUNNER_TEMP}/manual-rss-result.json" >/dev/null; then
          echo "dispatch=true" >> "${GITHUB_OUTPUT}"
        else
          echo "dispatch=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Upload manual PDF candidates
      id: upload-manual-candidates
      if: >-
        always() &&
        steps.manual-status.outputs.dispatch == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: manual-pdf-input-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/manual-pdf-input/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0

    - name: Commit and push changes
      id: commit-rss
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 使用GITHUB_TOKEN
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add rss/*
        if git diff --cached --quiet; then
          echo "No RSS changes to commit."
          exit 0
        fi
        git commit -m "Update RSS feeds"
        for attempt in 1 2 3; do
          git fetch origin "${TARGET_BRANCH}"
          git rebase "origin/${TARGET_BRANCH}"
          if git push origin "HEAD:${TARGET_BRANCH}"; then
            exit 0
          fi
          echo "Push attempt ${attempt} failed; retrying after rebase."
          sleep $((attempt * 2))
        done
        echo "Failed to push RSS changes after 3 attempts."
        exit 1

    - name: Trigger manual PDF diff
      if: >-
        steps.commit-rss.outcome == 'success' &&
        steps.manual-status.outputs.dispatch == 'true' &&
        steps.upload-manual-candidates.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run manual_pdf_diff.yml \
          --ref "${TARGET_BRANCH}" \
          -f "source_run_id=${GITHUB_RUN_ID}" \
          -f "source_run_number=${GITHUB_RUN_NUMBER}" \
          -f "source_run_attempt=${GITHUB_RUN_ATTEMPT}" \
          -f "source_commit=${GITHUB_SHA}"

    - name: Report owner manual page failure
      if: always() && steps.manual-rss.outcome == 'failure'
      run: |
        if [[ -f "${RUNNER_TEMP}/manual-rss-result.json" ]]; then
          cat "${RUNNER_TEMP}/manual-rss-result.json"
        fi
        exit 1
