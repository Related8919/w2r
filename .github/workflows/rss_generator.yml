name: Generate RSS Feed

on:
  push:
    branches:
      - main  # 或你想要的分支
    paths:
      - '.github/workflows/rss_generator.yml'
      - 'rss_generator.py'
      - 'config.yaml'
      - 'scripts/manual_version_monitor.py'
      - 'requirements.txt'
  schedule:
    - cron: '0 0 * * *'  # 每天运行一次
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: rss-generator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET_BRANCH: ${{ github.ref_name }}
  MODEL3_MANUAL_URL: ${{ secrets.MODEL3_MANUAL_URL }}
  MODELY_MANUAL_URL: ${{ secrets.MODELY_MANUAL_URL }}
  MANUAL_VERSION_CONTAINER_CSS: ${{ secrets.MANUAL_VERSION_CONTAINER_CSS }}
  MANUAL_VERSION_TEXT_PREFIX: ${{ secrets.MANUAL_VERSION_TEXT_PREFIX }}
  MANUAL_PDF_LINK_CSS: ${{ secrets.MANUAL_PDF_LINK_CSS }}
  MODEL3_MANUAL_RSS_PATH: "rss/model3_manual.xml"
  MODELY_MANUAL_RSS_PATH: "rss/modely_manual.xml"
  MANUAL_STATE_RELEASE_TAG: "manual-version-state"
  MANUAL_STATE_DIR: ".manual-state"
  MANUAL_RESULT_FILE: ".manual-state/result.json"
  GEMINI_MODEL: "gemini-2.5-flash"
  MANUAL_REQUEST_TIMEOUT_SECONDS: "120"
  MANUAL_RSS_MAX_ITEMS: "50"
  BARK_BASE_URL: "https://api.day.app"
  MANUAL_BARK_TITLE: "车主手册更新"
  MANUAL_BARK_GROUP: "车主手册"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'  # 或其他你需要的版本

    - name: Install dependencies
      run: |
        pip install -r requirements.txt  # 确保requirements.txt包含selenium和其他依赖

    - name: Run RSS generator
      run: |
        python rss_generator.py  # 运行你的Python脚本
    - name: Download Microsoft Research Feed
      run: |
        curl -o rss/MicrosoftResearch.xml https://www.microsoft.com/en-us/research/feed/

    - name: Restore manual baselines
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "${MANUAL_STATE_DIR}"
        if gh release view "${MANUAL_STATE_RELEASE_TAG}" >/dev/null 2>&1; then
          asset_count="$(gh release view "${MANUAL_STATE_RELEASE_TAG}" \
            --json assets --jq '.assets | length')"
          if [[ "${asset_count}" -gt 0 ]]; then
            gh release download "${MANUAL_STATE_RELEASE_TAG}" \
              --dir "${MANUAL_STATE_DIR}" \
              --pattern "*manual*" \
              --clobber
          fi
        else
          gh release create "${MANUAL_STATE_RELEASE_TAG}" \
            --title "Manual version monitoring state" \
            --notes "Current PDF baselines used by the owner manual monitor."
        fi

    - name: Monitor owner manuals
      id: manual-monitor
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BARK_TOKEN: ${{ secrets.BARK_TOKEN }}
      run: |
        python scripts/manual_version_monitor.py \
          --state-dir "${MANUAL_STATE_DIR}" \
          --result-file "${MANUAL_RESULT_FILE}"

    - name: Commit and push changes
      id: commit-rss
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 使用GITHUB_TOKEN
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add rss/*
        if git diff --cached --quiet; then
          echo "No RSS changes to commit."
          exit 0
        fi
        git commit -m "Update RSS feeds"
        for attempt in 1 2 3; do
          git fetch origin "${TARGET_BRANCH}"
          git rebase "origin/${TARGET_BRANCH}"
          if git push origin "HEAD:${TARGET_BRANCH}"; then
            exit 0
          fi
          echo "Push attempt ${attempt} failed; retrying after rebase."
          sleep $((attempt * 2))
        done
        echo "Failed to push RSS changes after 3 attempts."
        exit 1

    - name: Save manual baselines
      if: always() && steps.commit-rss.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        assets=()
        for asset in \
          manual-version-state.json \
          model3-manual-current.pdf \
          modely-manual-current.pdf; do
          if [[ -f "${MANUAL_STATE_DIR}/${asset}" ]]; then
            assets+=("${MANUAL_STATE_DIR}/${asset}")
          fi
        done
        if (( ${#assets[@]} )); then
          gh release upload "${MANUAL_STATE_RELEASE_TAG}" "${assets[@]}" --clobber
        fi

    - name: Report manual monitor failure
      if: steps.manual-monitor.outcome == 'failure'
      run: |
        if [[ -f "${MANUAL_RESULT_FILE}" ]]; then
          cat "${MANUAL_RESULT_FILE}"
        fi
        exit 1
